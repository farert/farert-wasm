name: farert_wasm
description: "Japanese Railway Fare Calculation WebAssembly plugin for Flutter. High-performance C++ engine compiled to WebAssembly with Dart bindings."
version: 2.0.0
homepage: https://github.com/farert-dev/farert-wasm
repository: https://github.com/farert-dev/farert-wasm
issue_tracker: https://github.com/farert-dev/farert-wasm/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.farert.wasm
        pluginClass: FarertWasmPlugin
      ios:
        pluginClass: FarertWasmPlugin
      web:
        pluginClass: FarertWasmWeb
        fileName: farert_wasm_web.dart
      windows:
        pluginClass: FarertWasmPluginCApi
        dartPluginClass: FarertWasmWindows
      linux:
        pluginClass: FarertWasmPluginCApi
        dartPluginClass: FarertWasmLinux
      macos:
        pluginClass: FarertWasmPluginCApi
        dartPluginClass: FarertWasmMacOS

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  ffi: ^2.1.0
  js: ^0.7.1
  web: ^1.0.0
  http: ^1.2.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.4.3
  build_runner: ^2.4.7

topics:
  - webassembly
  - wasm
  - railway
  - fare-calculation
  - japanese-railway
  - transport
  - flutter
  - dart
  - c++
  - sqlite

funding:
  - https://github.com/sponsors/farert-dev

screenshots:
  - description: 'Flutter Railway Fare Calculator Demo'
    path: screenshots/demo.png
  - description: 'API Integration Example'
    path: screenshots/api_example.png