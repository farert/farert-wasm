<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<title>%sveltekit.title%</title>
		<meta name="title" content="Farert Svelte Components Showcase" />
		<meta name="description" content="Interactive showcase of Svelte components for Japanese railway fare calculation using WebAssembly SDK" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://farert-svelte-components.vercel.app/" />
		<meta property="og:title" content="Farert Svelte Components Showcase" />
		<meta property="og:description" content="Interactive showcase of Svelte components for Japanese railway fare calculation using WebAssembly SDK" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://farert-svelte-components.vercel.app/" />
		<meta property="twitter:title" content="Farert Svelte Components Showcase" />
		<meta property="twitter:description" content="Interactive showcase of Svelte components for Japanese railway fare calculation using WebAssembly SDK" />
		
		<!-- Fonts for Japanese text support -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		
		<!-- Base styles -->
		<style>
			*, *::before, *::after {
				box-sizing: border-box;
			}
			
			body {
				margin: 0;
				font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.6;
				color: #1f2937;
				background: #f9fafb;
				min-height: 100vh;
				font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
			}
			
			:lang(ja) {
				font-family: 'Noto Sans JP', 'Inter', sans-serif;
			}
			
			code, pre {
				font-family: 'JetBrains Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
			}
			
			.visually-hidden {
				position: absolute !important;
				width: 1px !important;
				height: 1px !important;
				padding: 0 !important;
				margin: -1px !important;
				overflow: hidden !important;
				clip: rect(0,0,0,0) !important;
				white-space: nowrap !important;
				border: 0 !important;
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div id="app" class="h-full">%sveltekit.body%</div>
	</body>
</html>
