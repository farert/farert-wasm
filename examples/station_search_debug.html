<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARERT WASM - デバッグ</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .error {
            background: #ffebee;
            border: 2px solid #f44336;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #2196f3;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>FARERT WASM - 初期化デバッグ</h1>
    <div id="logs"></div>

    <script type="module">
        const logsDiv = document.getElementById('logs');

        function log(message, type = 'log') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<pre>${new Date().toISOString()}: ${message}</pre>`;
            logsDiv.appendChild(div);
            console.log(message);
        }

        async function test() {
            try {
                log('Step 1: インポート開始...');
                const module = await import('../dist/index.js');
                log('Step 2: インポート成功: ' + JSON.stringify(Object.keys(module)), 'success');

                log('Step 3: initFarert を呼び出し...');
                await module.initFarert();
                log('Step 4: initFarert 成功', 'success');

                log('Step 5: searchStationByKeyword をテスト...');
                const result = module.searchStationByKeyword('東京');
                log('Step 6: 検索成功\n' + result, 'success');

                const data = JSON.parse(result);
                log('Step 7: JSON パース成功\n' + JSON.stringify(data, null, 2), 'success');

            } catch (error) {
                log('❌ エラー発生:\n' + error.stack, 'error');
                console.error('詳細エラー:', error);
            }
        }

        log('開始...');
        test();
    </script>
</body>
</html>
