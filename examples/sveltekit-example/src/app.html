<!doctype html>
<html lang="ja" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<title>%sveltekit.title%</title>
		<meta name="title" content="Farert WebAssembly SDK - SvelteKit Example" />
		<meta name="description" content="Comprehensive SvelteKit example demonstrating Japanese railway fare calculation using WebAssembly SDK" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://farert-sveltekit-example.vercel.app/" />
		<meta property="og:title" content="Farert WebAssembly SDK - SvelteKit Example" />
		<meta property="og:description" content="Comprehensive SvelteKit example demonstrating Japanese railway fare calculation using WebAssembly SDK" />
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://farert-sveltekit-example.vercel.app/" />
		<meta property="twitter:title" content="Farert WebAssembly SDK - SvelteKit Example" />
		<meta property="twitter:description" content="Comprehensive SvelteKit example demonstrating Japanese railway fare calculation using WebAssembly SDK" />
		<meta property="twitter:image" content="%sveltekit.assets%/og-image.png" />
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
		
		<!-- Styles -->
		<style>
			/* Basic CSS Reset and Typography */
			*, *::before, *::after {
				box-sizing: border-box;
			}
			
			body {
				margin: 0;
				font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
				line-height: 1.6;
				color: #1f2937;
				background: #f9fafb;
				min-height: 100vh;
			}
			
			/* Japanese text support */
			:lang(ja) {
				font-family: 'Noto Sans JP', 'Inter', sans-serif;
			}
			
			/* Dark mode support */
			@media (prefers-color-scheme: dark) {
				body {
					color: #f9fafb;
					background: #111827;
				}
			}
			
			/* Loading animation */
			.loading-spinner {
				display: inline-block;
				width: 20px;
				height: 20px;
				border: 3px solid rgba(99, 102, 241, 0.3);
				border-radius: 50%;
				border-top-color: #6366f1;
				animation: spin 1s ease-in-out infinite;
			}
			
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
			
			/* Utility classes */
			.visually-hidden {
				position: absolute !important;
				width: 1px !important;
				height: 1px !important;
				padding: 0 !important;
				margin: -1px !important;
				overflow: hidden !important;
				clip: rect(0,0,0,0) !important;
				white-space: nowrap !important;
				border: 0 !important;
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div id="app" class="h-full">%sveltekit.body%</div>
	</body>
</html>
