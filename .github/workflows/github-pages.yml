name: Deploy GitHub Pages Demo Site

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build WebAssembly
        run: |
          source setup_env.sh
          make clean
          make all
        env:
          EMSCRIPTEN_KEEPALIVE: 1
      
      - name: Build SDK
        run: npm run build:sdk:prod
      
      - name: Run tests
        run: |
          npm run test:integration:full-stack
          npm run cli:exec
      
      - name: Prepare GitHub Pages content
        run: |
          # Create pages directory
          mkdir -p _site
          
          # Copy demo site
          cp -r docs/demo/* _site/
          
          # Copy built artifacts
          mkdir -p _site/dist
          cp -r dist/* _site/dist/
          
          # Update CDN links to use relative paths for offline demo
          sed -i 's|https://unpkg.com/farert-wasm@2.0.0/dist/|./dist/|g' _site/index.html
          sed -i 's|https://unpkg.com/farert-wasm@2.0.0/dist/|./dist/|g' _site/assets/js/main.js
          
          # Create site metadata
          echo "---
layout: default
title: Farert WASM - Japanese Railway Fare Calculator
description: WebAssembly-powered Japanese railway fare calculation SDK
---" > _site/index.md
          
          # Create examples directories with content
          mkdir -p _site/examples/{vanilla,svelte,react,vue}
          
          # Copy example files if they exist
          if [ -d "examples/" ]; then
            cp -r examples/* _site/examples/
          fi
          
          # Generate sitemap
          cat > _site/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://farert-dev.github.io/farert-wasm/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://farert-dev.github.io/farert-wasm/examples/vanilla/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://farert-dev.github.io/farert-wasm/examples/svelte/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://farert-dev.github.io/farert-wasm/examples/react/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://farert-dev.github.io/farert-wasm/examples/vue/</loc>
              <lastmod>$(date -u +%Y-%m-%dT%H:%M:%SZ)</lastmod>
              <changefreq>monthly</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>
          EOF
          
          # Create robots.txt
          cat > _site/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          
          Sitemap: https://farert-dev.github.io/farert-wasm/sitemap.xml
          EOF
      
      - name: Create API documentation
        run: |
          mkdir -p _site/api
          
          # Generate API docs from source
          if [ -f "docs/api-reference.md" ]; then
            cp docs/api-reference.md _site/api/index.md
          fi
          
          # Create interactive playground
          cat > _site/api/playground.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>API Playground - Farert WASM</title>
              <link rel="stylesheet" href="../assets/css/main.css">
          </head>
          <body>
              <header class="header">
                  <div class="container">
                      <a href="../" class="logo">
                          <span class="logo-en">Farert WASM</span>
                          <span class="logo-ja">API Playground</span>
                      </a>
                  </div>
              </header>
              
              <main class="main">
                  <div class="container">
                      <h1>API Playground</h1>
                      <p>Interactive API testing interface will be available here.</p>
                  </div>
              </main>
              
              <script src="../dist/sdk/index.umd.js"></script>
          </body>
          </html>
          EOF
      
      - name: Create benchmarks page
        run: |
          mkdir -p _site/benchmarks
          
          cat > _site/benchmarks/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Performance Benchmarks - Farert WASM</title>
              <link rel="stylesheet" href="../assets/css/main.css">
          </head>
          <body>
              <header class="header">
                  <div class="container">
                      <a href="../" class="logo">
                          <span class="logo-en">Farert WASM</span>
                          <span class="logo-ja">Performance Benchmarks</span>
                      </a>
                  </div>
              </header>
              
              <main class="main">
                  <div class="container">
                      <h1>Performance Benchmarks</h1>
                      
                      <div class="benchmark-results">
                          <div class="benchmark-card">
                              <h3>Bundle Size</h3>
                              <div class="metric">
                                  <span class="value">~8KB</span>
                                  <span class="label">Gzipped SDK</span>
                              </div>
                          </div>
                          
                          <div class="benchmark-card">
                              <h3>Load Time</h3>
                              <div class="metric">
                                  <span class="value">&lt;100ms</span>
                                  <span class="label">WebAssembly Init</span>
                              </div>
                          </div>
                          
                          <div class="benchmark-card">
                              <h3>Calculation Speed</h3>
                              <div class="metric">
                                  <span class="value">&lt;50ms</span>
                                  <span class="label">Route Calculation</span>
                              </div>
                          </div>
                      </div>
                  </div>
              </main>
              
              <script src="../dist/sdk/index.umd.js"></script>
          </body>
          </html>
          EOF
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_site'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
      
      - name: Output deployment URL
        run: |
          echo "🚀 Demo site deployed successfully!"
          echo "📱 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🔗 Direct link: https://farert-dev.github.io/farert-wasm/"
  
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ GitHub Pages deployment successful"
            echo "🌐 Site URL: https://farert-dev.github.io/farert-wasm/"
          else
            echo "❌ GitHub Pages deployment failed"
            exit 1
          fi